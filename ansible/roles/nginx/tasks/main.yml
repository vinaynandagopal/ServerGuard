---
- name: Remove default site (it listens on 0.0.0.0:80)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Install ServerGuard reverse-proxy site
  ansible.builtin.template:
    src: serverguard.conf.j2
    dest: /etc/nginx/sites-available/serverguard
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/serverguard
    dest: /etc/nginx/sites-enabled/serverguard
    state: link
  notify: Reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
