name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: pytest -q

  docker:
    name: Build and smoke-test the Docker image
    runs-on: ubuntu-latest
    needs: test            # only runs if the tests passed
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t serverguard:ci .

      - name: Start the container
        run: docker run -d --name serverguard -p 127.0.0.1:5000:5000 serverguard:ci

      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health; then
              echo
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy" >&2
          docker logs serverguard
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs serverguard
