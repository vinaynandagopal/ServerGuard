name: Infrastructure checks

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: No secrets or state committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if state, tfvars, generated inventory or keys are tracked
        run: |
          if git ls-files | grep -E '(\.tfstate|terraform\.tfvars$|inventory/aws\.ini$|\.pem$)'; then
            echo "::error::Sensitive or generated file is tracked by git"
            exit 1
          fi

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Dummy SSH key (main.tf reads the .pub file)
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/serverguard_aws -N "" -q
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend, no AWS credentials needed)
        run: terraform init -backend=false
      - name: Validate
        env:
          TF_VAR_my_ip_cidr: "203.0.113.7/32"
        run: terraform validate

  ansible:
    name: Ansible syntax-check and ansible-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible tooling
        run: pip install ansible-core ansible-lint
      - name: Syntax check
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook verify.yml --syntax-check
      - name: Lint
        run: ansible-lint site.yml verify.yml roles/
